services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: moveinrange
      POSTGRES_USER: moveinrange
      POSTGRES_PASSWORD: moveinrange
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moveinrange"]
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
