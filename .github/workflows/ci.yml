name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: moveinrange_test
          POSTGRES_USER: moveinrange
          POSTGRES_PASSWORD: moveinrange
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U moveinrange"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql+psycopg://moveinrange:moveinrange@localhost:5432/moveinrange_test
      TEST_DATABASE_URL: postgresql+psycopg://moveinrange:moveinrange@localhost:5432/moveinrange_test
      REDIS_URL: redis://localhost:6379/0
      AUTH_PROVIDER: local
      AUTH_SECRET: ci-moveinrange-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - name: Expo Doctor
        working-directory: apps/mobile
        run: npx expo-doctor
      - name: Expo dependency check
        working-directory: apps/mobile
        run: npx expo install --check
      - run: npm run format:check
      - run: npm run lint
      - run: npm run checklist:check
      - run: npm run typecheck
      - run: npm run test
      - run: python -m pip install -r services/api/requirements.txt
      - run: npm run db:migrate
      - run: npm run import:exercises -- tests/fixtures/exercises.sample.json
      - run: ruff check services/api
      - run: pytest services/api/tests
      - run: npm run build
