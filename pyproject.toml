[project]
name = "moveinrange-vercel-api"
version = "0.1.0"
requires-python = "~=3.12.0"
dependencies = [
  "fastapi==0.139.2",
  "uvicorn[standard]==0.34.2",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.2",
  "SQLAlchemy==2.0.41",
  "alembic==1.15.2",
  "psycopg[binary]==3.3.4",
  "redis==6.1.0",
  "httpx==0.28.1",
  "jsonschema==4.23.0",
  "python-slugify==8.0.4"
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
pythonpath = ["services/api"]
